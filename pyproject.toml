[project]
name = "report-builder"
version = "0.1.0"
description = "A small tool-using agent that writes a monthly review from a dataset (hiring challenge)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_builder"]

[tool.ruff]
line-length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]
